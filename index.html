<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CapitalFlow</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e7ebf2;background:#0c111a}*{box-sizing:border-box}body{margin:0}header{padding:22px max(20px,calc((100vw - 1080px)/2));background:#131b28;border-bottom:1px solid #283449}main{max-width:1080px;margin:auto;padding:24px 18px}h1{margin:0;font-size:24px;letter-spacing:-.5px}h2{font-size:18px}small,.muted{color:#93a1b6}nav{display:flex;gap:8px;overflow:auto;margin:20px 0}button,select,input{font:inherit;color:inherit;background:#192536;border:1px solid #34445a;border-radius:10px;padding:12px}button{cursor:pointer}button.active,.primary{background:#376cce;border-color:#376cce;color:white}section,.panel{background:#131d2b;border:1px solid #29374b;border-radius:16px;padding:20px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#1a2637;border-radius:12px;padding:18px}.value{font-size:26px;font-weight:750;margin-top:10px}.negative{color:#ff8b8b}.positive{color:#6bd9b0}form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:flex;flex-direction:column;gap:7px;color:#b6c4d7;font-size:13px}input,select{width:100%;font-size:15px}form button{align-self:end}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:12px 7px;border-bottom:1px solid #2c3a4d;text-align:left}th{color:#9cabc0}#notice{color:#6bd9b0;margin:12px 0}footer{color:#8091a8;text-align:center;padding:30px}@media(max-width:650px){.cards{grid-template-columns:1fr}form{grid-template-columns:1fr}.wide{grid-column:auto}.value{font-size:23px}table{font-size:12px}}
</style><header><h1>CapitalFlow <small> / Macosh Apps</small></h1><small>Finanse struktury Macosharo</small></header><main><nav id="units"></nav><div class="cards" id="metrics"></div><section><h2>Nowa operacja</h2><form id="entry"><label>Rodzaj operacji<select id="type"><option value="income">Przychód</option><option value="expense">Wydatek</option><option value="deposit">Wpłata kapitału</option><option value="withdraw">Wypłata kapitału</option><option value="transfer">Transfer</option></select></label><label>Projekt<select id="from"></select></label><label id="targetWrap" hidden>Do projektu<select id="to"></select></label><label>Kwota (zł)<input id="amount" type="number" min=".01" step=".01" required></label><label class="wide">Opis<input id="desc" maxlength="160" placeholder="Np. drukarka, sprzedaż przypinek"></label><button class="primary wide">Zapisz operację</button></form><p id="notice"></p></section><section><h2>Historia operacji</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Rodzaj</th><th>Projekt</th><th>Kwota</th><th>Opis</th><th></th></tr></thead><tbody id="history"></tbody></table></div></section><section><h2>Ustawienia i kopia danych</h2><p class="muted">Eksport i import JSON. Dane przechowywane lokalnie na tym urządzeniu.</p><button id="export">Eksport JSON</button> <button id="importBtn">Import JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><hr style="border:0;border-top:1px solid #29374b;margin:24px 0"><small>CapitalFlow · wersja 0.1.0 · Macosh Apps</small></section></main><footer>Macosharo · Zarządzanie kapitałem</footer><script>
const hierarchy={Macosharo:null,Macosh:"Macosharo",Prendi:"Macosharo",Diguana:"Macosharo","Macosh Apps":"Macosh","Macosh Games":"Macosh",ElectroStock:"Macosh Apps",Valuty:"Macosh Apps",MarketAtlas:"Macosh Apps",WinTracker:"Macosh Apps",LootVault:"Macosh Apps",Makumbex:"Prendi",Thumbrex:"Prendi",Digitumbex:"Diguana",Arexys:"Diguana"};const names=Object.keys(hierarchy),key="capitalflow_v1";let entries=[];try{const saved=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(saved))entries=saved}catch{}let selected="Macosharo";const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("pl-PL",{style:"currency",currency:"PLN"}).format(n),children=n=>names.filter(x=>x===n||hierarchy[x]&&children(n).includes(hierarchy[x]));function inScope(unit,root){let n=unit;while(n){if(n===root)return true;n=hierarchy[n]}return false}function save(){localStorage.setItem(key,JSON.stringify(entries));render()}function calc(unit){let revenue=0,cost=0,balance=0;for(const e of entries){const inside=inScope(e.from,unit),dest=e.to&&inScope(e.to,unit),v=e.amount;if(e.type==="income"&&inside){revenue+=v;balance+=v}if(e.type==="expense"&&inside){cost+=v;balance-=v}if(e.type==="deposit"&&inside)balance+=v;if(e.type==="withdraw"&&inside)balance-=v;if(e.type==="transfer"){if(inside&&!dest)balance-=v;if(dest&&!inside)balance+=v}}return{revenue,net:revenue-cost,balance}}const types={income:"Przychód",expense:"Wydatek",deposit:"Wpłata kapitału",withdraw:"Wypłata kapitału",transfer:"Transfer"};function render(){ $("units").innerHTML=names.map(n=>'<button class="'+(selected===n?"active":"")+'" data-unit="'+n+'">'+n+'</button>').join("");document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{selected=b.dataset.unit;render()});const c=calc(selected);$("metrics").innerHTML=[["Przychody łącznie",c.revenue],["Wynik po wydatkach",c.net],["Dostępne środki",c.balance]].map(([title,value])=>'<div class="card"><small>'+title+'</small><div class="value '+(value<0?"negative":"")+'">'+money(value)+'</div></div>').join("");$("history").innerHTML=entries.filter(e=>inScope(e.from,selected)||(e.to&&inScope(e.to,selected))).slice().reverse().map(e=>'<tr><td>'+new Date(e.date).toLocaleDateString("pl-PL")+'</td><td>'+types[e.type]+'</td><td>'+e.from+(e.to?" → "+e.to:"")+'</td><td>'+money(e.amount)+'</td><td>'+escapeHtml(e.desc||"")+'</td><td><button data-del="'+e.id+'" aria-label="Usuń">×</button></td></tr>').join("")||'<tr><td colspan="6">Brak operacji</td></tr>';document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Usunąć operację?")){entries=entries.filter(e=>e.id!==b.dataset.del);save()}})}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}for(const id of ["from","to"])$(id).innerHTML=names.map(n=>'<option>'+n+'</option>').join("");$("from").value="Makumbex";$("to").value="Prendi";$("type").onchange=()=>{$("targetWrap").hidden=$("type").value!=="transfer"};$("entry").onsubmit=e=>{e.preventDefault();const amount=Math.round(Number($("amount").value)*100)/100,from=$("from").value,to=$("to").value,type=$("type").value;if(!Number.isFinite(amount)||amount<=0)return alert("Podaj prawidłową kwotę");if(type==="transfer"&&from===to)return alert("Wybierz dwa różne projekty");entries.push({id:crypto.randomUUID(),date:new Date().toISOString(),type,from,to:type==="transfer"?to:null,amount,desc:$("desc").value});$("amount").value="";$("desc").value="";$("notice").textContent="Operacja zapisana";save()};$("export").onclick=()=>{const data=JSON.stringify({app:"CapitalFlow",version:1,entries},null,2),url=URL.createObjectURL(new Blob([data],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="CapitalFlow-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.app!=="CapitalFlow"||!Array.isArray(d.entries)||!d.entries.every(x=>names.includes(x.from)&&types[x.type]&&Number.isFinite(x.amount)&&x.amount>0&&(!x.to||names.includes(x.to))))throw Error("Nieprawidłowy plik");if(confirm("Zastąpić obecne dane kopią?")){entries=d.entries;save();$("notice").textContent="Kopia przywrócona"}}catch(err){alert("Nie udało się wczytać kopii JSON")}};render();
</script><script>
window.receiveAndroidBackup=function(json){try{const d=JSON.parse(json);if(d.app!=="CapitalFlow"||!Array.isArray(d.entries)||!d.entries.every(x=>names.includes(x.from)&&types[x.type]&&Number.isFinite(x.amount)&&x.amount>0&&(!x.to||names.includes(x.to))))throw Error();if(confirm("Zastąpić obecne dane kopią?")){entries=d.entries;save();document.getElementById("notice").textContent="Kopia przywrócona"}}catch(e){alert("Nieprawidłowy plik kopii")}};
if(window.AndroidBackup){document.getElementById("export").onclick=()=>AndroidBackup.exportJson(JSON.stringify({app:"CapitalFlow",version:1,entries},null,2));document.getElementById("importBtn").onclick=()=>AndroidBackup.importJson();}
</script></html>
